<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto gallerij MK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="homepagina">
        <nav aria-label="hoofdnavigatie">
            <ul>
                <li><a href="index.html">homepagina</a></li>
                <li><a href="hoornbeeck_college.html">hoornbeeck college</a></li>
                <li><a href="over_ons.html">over ons</a></li>
                <li><a href="contact.html">contact</a></li>
                <li><a href="foto_gallarij.html">foto gallerij</a></li>
                <li><a href="opleidingen.html">opleidingen</a></li>
            </ul>
        </nav>
    </header>

    <main class="gallery-page">
        <section class="hero">
            <p class="tag">Onze school</p>
            <h1>Foto gallerij</h1>
        </section>
        <div class="fotogalleryimg">
        <section class="gallery-grid" aria-label="Schoolfoto's">
            <figure class="gallery-item tall">
                <img src="img/hoornbeeck.jpg" alt="Hoornbeeck gebouw">
                <figcaption>Hoornbeeck</figcaption>
            </figure>

            <div style="position: relative; width: 100%; height: 0; padding-top: 56.2500%;
            padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
            border-radius: 8px; will-change: transform;">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
            src="https://www.canva.com/design/DAHS1A4clk0/cCKoz7cOv-g58F0i7QrjSw/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
            </div>

            <figure class="gallery-item wide">
                <img src="img/school.jpg" alt="Schoolomgeving">
                <figcaption>Schoolomgeving</figcaption>
            </figure>

            <figure class="gallery-item gallery-bottom-item">
                <img src="img/huis.jpg" alt="Huis foto">
                <figcaption>Huis</figcaption>
            </figure>

            <a class="dora-link" href="https://www.canva.com/design/DAHS1A4clk0/cCKoz7cOv-g58F0i7QrjSw/view" target="_blank" rel="noopener" aria-label="Open de Dora foto link">
                <figure class="gallery-item gallery-bottom-item dora-card">
                    <img class="dora-image" src="img/dora.jpg" alt="Dora foto">
                    <figcaption>Dora</figcaption>
                </figure>
            </a>

            <figure class="gallery-item gallery-bottom-item">
                <img src="img/Hoornbeeck_college.jpg" alt="Hoornbeeck college logo">
                <figcaption>College</figcaption>
            </figure>
            
        </section>
        </div>
    </main>
</body>
</html>
